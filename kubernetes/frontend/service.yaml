apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP   #should be changed to LoadBalancer for production ( or use ingress and keep it clusterip)
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
     # nodePort: 30080   #should be excluded for LoadBalancer type