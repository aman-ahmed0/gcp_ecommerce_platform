
name: App CI/CD - GCP Ecommerce Platform

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'kubernetes/backend/**'
      - 'kubernetes/frontend/**'
      - 'VERSION'
      - '.github/workflows/application.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'kubernetes/backend/**'
      - 'kubernetes/frontend/**'

  workflow_dispatch:

env:
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
  IMAGE_NAME: gcp-ecommerce-platform
  SONAR_ORG: ${{ vars.SONAR_ORG }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Read current version
        id: version
        run: |
          if [ -f VERSION ]; then
            CURRENT_VERSION=$(cat VERSION)
          else
            CURRENT_VERSION="1.0.0"
            echo "1.0.0" > VERSION
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies and run tests
        run: |
          set -e

          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          pip install pytest pytest-cov

          if [ -d backend/tests ]; then
            pytest backend/tests -v --cov=backend --cov-report=xml
          else
            echo "No backend tests found. Skipping pytest."
          fi

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=AhmeFawzy_gcp-ecommerce-platform
            -Dsonar.sources=backend,frontend
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.branch.name=${{ github.ref_name }}
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies and build
        run: |
          cd frontend
          npm install

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No frontend build script found. Skipping build."
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          VERSION=${{ steps.version.outputs.current_version }}

          BACKEND_VERSIONED_IMAGE="${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:backend-${VERSION}"
          BACKEND_LATEST_IMAGE="${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:backend-latest"

          docker build \
            -t $BACKEND_VERSIONED_IMAGE \
            -t $BACKEND_LATEST_IMAGE \
            ./backend

          docker push $BACKEND_VERSIONED_IMAGE
          docker push $BACKEND_LATEST_IMAGE

          echo "BACKEND_VERSIONED_IMAGE=$BACKEND_VERSIONED_IMAGE" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          VERSION=${{ steps.version.outputs.current_version }}

          FRONTEND_VERSIONED_IMAGE="${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:frontend-${VERSION}"
          FRONTEND_LATEST_IMAGE="${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:frontend-latest"

          docker build \
            -t $FRONTEND_VERSIONED_IMAGE \
            -t $FRONTEND_LATEST_IMAGE \
            ./frontend

          docker push $FRONTEND_VERSIONED_IMAGE
          docker push $FRONTEND_LATEST_IMAGE

          echo "FRONTEND_VERSIONED_IMAGE=$FRONTEND_VERSIONED_IMAGE" >> $GITHUB_ENV

      - name: Run Trivy scan - backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.BACKEND_VERSIONED_IMAGE }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true

      - name: Run Trivy scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.FRONTEND_VERSIONED_IMAGE }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true

      - name: Update Kubernetes manifests with new image versions
        if: github.event_name == 'push'
        run: |
          echo "Backend image: $BACKEND_VERSIONED_IMAGE"
          echo "Frontend image: $FRONTEND_VERSIONED_IMAGE"

          perl -i -pe "s|image:\s*[^\n]*gcp-ecommerce-platform:backend-[^\n]*|image: $BACKEND_VERSIONED_IMAGE|g" kubernetes/backend/deployment.yaml
          perl -i -pe "s|image:\s*[^\n]*gcp-ecommerce-platform:frontend-[^\n]*|image: $FRONTEND_VERSIONED_IMAGE|g" kubernetes/frontend/deployment.yaml

          perl -i -pe "s|image:\s*[^\n]*homeoffice-backend[^\n]*|image: $BACKEND_VERSIONED_IMAGE|g" kubernetes/backend/deployment.yaml
          perl -i -pe "s|image:\s*[^\n]*homeoffice-frontend[^\n]*|image: $FRONTEND_VERSIONED_IMAGE|g" kubernetes/frontend/deployment.yaml

          perl -i -pe "s|imagePullPolicy:\s*[^\n]*|imagePullPolicy: Always|g" kubernetes/backend/deployment.yaml
          perl -i -pe "s|imagePullPolicy:\s*[^\n]*|imagePullPolicy: Always|g" kubernetes/frontend/deployment.yaml

          echo "=== Backend deployment image ==="
          grep "image:" kubernetes/backend/deployment.yaml

          echo "=== Frontend deployment image ==="
          grep "image:" kubernetes/frontend/deployment.yaml

      - name: Bump version for next build
        if: github.event_name == 'push'
        run: |
          CURRENT=${{ steps.version.outputs.current_version }}

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo $NEW_VERSION > VERSION
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          echo "Bumped version from $CURRENT to $NEW_VERSION"

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true

          git add VERSION kubernetes/backend/deployment.yaml kubernetes/frontend/deployment.yaml

          git commit -m "chore: deploy version ${{ steps.version.outputs.current_version }} and bump to $NEW_VERSION" || echo "No changes to commit"

          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

